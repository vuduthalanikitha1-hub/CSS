<!DOCTYPE html>
<html>
<head>
    <title>Responsive Menu</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
        }
        nav {
            background: #222;
            display: flex;
            justify-content: center;
        }
        nav a {
            color: white;
            padding: 16px 24px;
            text-decoration: none;
        }
        nav a:hover {
            background: #00b894;
        }
        @media (max-width: 500px) {
            nav {
                flex-direction: column;
            }
            nav a {
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#services">Services</a>
        <a href="#contact">Contact</a>
    </nav>
</body>
</html>
