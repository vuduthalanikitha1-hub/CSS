
<!DOCTYPE html>
<html>
<head>
    <title>Animated Button</title>
    <style>
        button {
            padding: 15px 30px;
            background: #6c5ce7;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            transition: 0.4s;
            cursor: pointer;
        }
        button:hover {
            background: #00b894;
            transform: translateY(-5px);
            box-shadow: 0 8px 15px #aaa;
        }
    </style>
</head>
<body>
    <button>Click Me</button>
</body>
</html>
