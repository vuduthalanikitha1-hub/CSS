<!DOCTYPE html>
<html>
<head>
    <title>CSS Card</title>
    <style>
        .card {
            width: 250px;

    </style>

        <h2>My Profile</h2>

        <p>Student</p>
        <button>View Profile</button>
    </div>

</html>
