
<!DOCTYPE html>
<html>
<head>
    <title>CSS Table</title>
    <style>
        table {
            border-collapse: collapse;
            width: 60%;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: blue;
            color: white;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <th>Name</th>
            <th>Marks</th>
        </tr>
        <tr>
            <td>Navya</td>
            <td>90</td>
        </tr>
        <tr>
            <td>Ravi</td>
            <td>85</td>
        </tr>
    </table>
</body>
</html>
