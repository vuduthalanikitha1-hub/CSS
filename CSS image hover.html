
<!DOCTYPE html>
<html>
<head>
    <title>Image Hover</title>
    <style>
        img {
            width: 300px;
            height: 200px;
            object-fit: cover;
            transition: transform 0.5s;
        }
        img:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <h2>Image Hover Effect</h2>
    <img src="https://picsum.photos/300/200" alt="Sample image">
</body>
</html>
